[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardio_ml"
version = "1.0.0"
description = "Pipeline reprodutível: comparação de cinco classificadores na base UCI Heart Disease (TCC, Fatec Ribeirão Preto)"
readme = "README.md"
license = "MIT"
authors = [{ name = "João Victor Mobiglia Podenciano" }]
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.3",
    "numpy==2.4.4",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
cardio-ml = "cardio_ml.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
